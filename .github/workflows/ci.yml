name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter @opina/widget build
      - name: Widget size < 8KB gzip
        run: |
          bytes=$(gzip -c packages/widget/dist/widget.js | wc -c)
          echo "widget gzip: ${bytes} bytes"
          test "$bytes" -lt 8192
          test ! -f packages/widget/dist/widget.js.map
          test -f apps/server/public/widget.js
      - run: bun run --filter @opina/widget typecheck
      - run: bun run --filter @opina/server test
      - run: bun run --filter @opina/server lint
      - run: bun run --filter @opina/server build
      - name: Widget Playwright smoke
        working-directory: apps/demo
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e
