name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Node 24+ required for reliable npm trusted publishing (OIDC).
      # Do not set registry-url: setup-node writes an empty _authToken that disables OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest

      - name: Clear classic npm auth so OIDC can run
        run: |
          unset NODE_AUTH_TOKEN
          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" .npmrc; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            sed -i '/_authToken/d' "$f" || true
            sed -i '/always-auth/d' "$f" || true
          done

      - run: bun install --frozen-lockfile

      - name: Sync package version from tag
        working-directory: packages/widget
        run: |
          version="${GITHUB_REF_NAME#v}"
          bun -e "
            const fs = require('fs')
            const version = process.argv[1]
            const path = 'package.json'
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
            pkg.version = version
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
            console.log(pkg.name + '@' + pkg.version)
          " "$version"

      - run: bun run --filter @opina/widget build

      - name: Debug OIDC environment
        run: |
          echo "bun=$(bun -v) node=$(node -v) npm=$(npm -v)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"

      - name: Publish @opina/widget
        working-directory: packages/widget
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --loglevel verbose
